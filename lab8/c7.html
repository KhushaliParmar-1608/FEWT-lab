        </tbody>

    <script>

            for(let i=0 ; i<arr.length ; i++){
                temp += `<tr> 
                <td>${i+1}</td>
                <td>${arr[i]}</td>
                <td><button onclick ="deletstudent()" >Delete</button></td>
                </td>`;
            }
            console.log(temp)
            document.getElementById("tableDate").innerHTML=temp;
        }

        function addstudent(){

        }
