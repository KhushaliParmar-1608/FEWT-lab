<!-- WAP to read an array from the user and sort them in ascending order(A) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Enter the size of an array : "));
        let arr = []
        let temp ;
        for(let i =0 ; i< n; i++){
            arr[i] = parseInt(prompt("Enter element of an array"));
        }

        for(let i=0 ; i<n ; i++){
            for(let j =i+1 ; j<n ; j++){
                if(arr[i] > arr[j]){
                    temp = arr[i];
                    arr[i] = arr[j];
                    arr[j] = temp;
                }
            }
        }
        document.write(arr);
    </script>
</body>
</html>
