<!-- Demonstrate the use of array to find maximum number(A) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Enter the size of an array : "));
        let arr = []
        for(let i =0 ; i< n; i++){
            arr[i] = parseInt(prompt("Enter element of an array"));
        }
        document.write(arr);
        let max = arr[0];
        for(let i =0 ; i< n; i++){
            if(arr[i]>max){
                max= arr[i];
            }
        }
        document.write("<br/>")
        document.write("Maximum element is "+max);
    </script>
</body>
</html>
