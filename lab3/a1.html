<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n1 = parseInt(prompt("Enter the Number 1 : "));
        let n2 = parseInt(prompt("Enter the Number 2 : "));

        let op = prompt("Enter the operation (+ , - , * , / ) : ");
        let ans;

        if(op == '+'){
            ans = n1+n2;
        }
        else if(op == '-'){
            ans = n1-n2;
        }
         else if(op == '*'){
            ans = n1*n2;
        }
        else if(op == '/' && n2!=0){
            ans = n1/n2;
        }
        else{
            alert("Invalid opration !!!!!");
        }
        alert("Ans = "+ans);
    </script>
</body>
</html>
