<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Enter the Number 1 : "));
        var count = 0 ;
        for(let i=2 ; i<n ; i++){
            if(n%i == 0){
                count ++;
            }
        }
        if(count == 0){
            alert(n+" is a prime number")
        }
        else{
            alert(n+" is not a prime number")
        }
    </script>
</body>
</html>
