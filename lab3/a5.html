<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n =parseInt(prompt("Enter the number : "));
        let original = n;
        let reverse =0;
        let remainder; 

        while(n != 0){
            remainder = n%10;
            n = parseInt(n/10);
            reverse = (reverse*10)+remainder;
        }
        if(original == reverse){
            alert(original + " is palindrome number")
        }
        else{
            alert(original + " is not palindrome number")
        }

    </script>
</body>
</html>
