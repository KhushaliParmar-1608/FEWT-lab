<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            border: 3px solid black;
            display: inline-block;
            padding: 20px;
            border-radius: 15px;
            background: white;
        }

        h2 {
            color: black;
        }

        #display {
            width: 260px;
            height: 50px;
            font-size: 22px;
            margin-bottom: 10px;
            text-align: right;
            padding-right: 10px;
        }

        button {
            width: 60px;
            height: 60px;
            font-size: 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: skyblue;
            color: white;
        }

        button:hover {
            background: darkcyan;
        }
    </style>
</head>

<body>

    <h2>Calculator</h2>

    <input type="text" id="display" >

    <br>

    <button onclick="dispaly('1')">1</button>
    <button onclick="dispaly('2')">2</button>
    <button onclick="dispaly('3')">3</button>
    <button onclick="dispaly('+')">+</button>

    <br>

    <button onclick="dispaly('4')">4</button>
    <button onclick="dispaly('5')">5</button>
    <button onclick="dispaly('6')">6</button>
    <button onclick="dispaly('-')">-</button>

    <br>

    <button onclick="dispaly('7')">7</button>
    <button onclick="dispaly('8')">8</button>
    <button onclick="dispaly('9')">9</button>
    <button onclick="dispaly('*')">*</button>

    <br>

    <button onclick="dispaly('0')">0</button>
    <button onclick="calculate()">=</button>
    <button onclick="clearDisplay()">C</button>
    <button onclick="backspace()">-></button>

    <script>
        function dispaly(value) {
            document.getElementById("display").value += value;
        }

        function clearDisplay() {
            document.getElementById("display").value = "";
        }

        function backspace() {
            let current = document.getElementById("display").value;
            document.getElementById("display").value = current.slice(0, -1);
        }

        function calculate() {
            let exp = document.getElementById("display").value;
            document.getElementById("display").value = eval(exp);
        }
    </script>

</body>

</html>
</body>

</html>
