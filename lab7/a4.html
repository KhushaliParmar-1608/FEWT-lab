<!-- 4. Write a JavaScript program to validate user data given from the HTML form (A) 
1) username must be of minimum 8 characters 
2) password must contain at least 1 digit and 1 special character and should be between 8-12 
characters 
3) password and repeat password must be same 
4) age must be greater than 18 (calculate from date of birth) 
5) enrollment must be of 11 digits 
6) email validation -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Registration Form</h2>

    <form onsubmit="validateForm(event)">

        Username:
        <input type="text" id="username"><br><br>

        Password:
        <input type="password" id="password"><br><br>

        Repeat Password:
        <input type="password" id="repassword"><br><br>

        Date of Birth:
        <input type="date" id="dob"><br><br>

        Age:
        <input type="number" id="age"><br><br>

        Enrollment No:
        <input type="text" id="enroll"><br><br>

        Email:
        <input type="text" id="email"><br><br>

        <input type="submit" value="Submit">

    </form>

    <script>

        function validateForm(event) {
            event.preventDefault();

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let repassword = document.getElementById("repassword").value;
            let dob = document.getElementById("dob").value;
            let enroll = document.getElementById("enroll").value;
            let email = document.getElementById("email").value;

            if (username.length < 8) {
                alert("Username must be at least 8 characters");
                return;
            }

            let passReg = /^(?=.*[0-9])(?=.*[!@#$%^&*])[A-Za-z0-9!@#$%^&*]{8,12}$/;

            if (!passReg.test(password)) {
                alert("Password must be 8-12 chars, 1 digit & 1 special character");
                return;
            }

            if (password != repassword) {
                alert("Passwords do not match");
                return;
            }

            
            let age 

            if (age < 18) {
                alert("Age must be greater than 18");
                return;
            }

            let enrollRegex = /^[0-9]{11}$/;

            if (!enrollRegex.test(enroll)) {
                alert("Enrollment must be  11 digits");
                return;
            }

            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailRegex.test(email)) {
                alert("Invalid email format");
                return;
            }

            alert("Form Submitted ");
        }

    </script>

</body>

</html>
