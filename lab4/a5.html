//WAP in javaScript to take a 2-digit number and then separate these 2 digit , then multiply frist 
//digit by its for second digit times

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n= parseInt(prompt("Enter the 2 digit number : "));
        let ans=1;

        while(n > 10){
            rem = n % 10;
            n=parseInt(n/10);
        }
        for(let i=1; i<=rem ; i++){
            ans = ans * n ;
        }
        document.write(ans);
    </script>
</body>
</html>
