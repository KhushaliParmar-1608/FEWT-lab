//WAP in javaScript to print the GCD of two numbers

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = parseInt(prompt("Enter the a :"));
        let b = parseInt(prompt("Enter the b :"));
        let n;
        let m;

        if(a>b){
            n= b % a;
            if(a % b == 0){
                document.write(n);
            }
            else{
                document.write("1")
            }
        }
        else{
            m = a % b;
            if(b % a == 0){
                document.write(m);
            }
             else{
                document.write("1")
            }
        }
    </script>
</body>
</html>
