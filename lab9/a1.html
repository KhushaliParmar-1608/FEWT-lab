<!-- 1. WAP to demonstrate callbacks in JavaScript. (A)  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function green(name , callback){
            document.write(name);
            callback();
        }
        function buy(){
            document.write(" Good buy !...");
        }
        green("khushali" , buy);
    </script>
</body>
</html>
