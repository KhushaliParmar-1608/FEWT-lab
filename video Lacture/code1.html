<!-- This is a simple HTML document that includes jQuery and logs "Hello World" to the console when the document is ready. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
        $(document).ready(() => {
            console.log("Hello World");
        }); 
    </script>
</body>

</html>
